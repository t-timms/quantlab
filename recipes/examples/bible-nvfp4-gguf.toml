# Example: the planned Bible-Assistant NVFP4-GGUF validation run (see
# local-llm-playbook PART 10, and bible-ai-assistant's own README Roadmap /
# CHANGELOG Unreleased entries). Requires a pre-converted BF16 GGUF - run
# convert_hf_to_gguf.py against Ttimms/Bible-Assistant-Qwen3.5-4B-v3.2 first.
name = "bible-assistant-nvfp4-gguf"
model = "Ttimms/Bible-Assistant-Qwen3.5-4B-v3.2"  # informational only for this backend
output = "~/models/bible-assistant-nvfp4-gguf"
backend = "gguf"

[calibration]
dataset = "data/calibration.txt"

[gguf]
profile = "nvfp4"
target_bpw = 4.8
mode = "normal"
tool_dir = "~/advanced-gguf-quantizer"
bf16_gguf = "~/models/bible-assistant-v3.2-bf16.gguf"
