# Real run, 2026-09-14 - the Bible-Assistant NVFP4-GGUF validation.
# v2: mode=normal ran to completion but hit severe GPU memory pressure during
# selector-stage-b candidate evaluation (192 tensors, "CUDA encoder search
# failed", cuda_mem_free=0.00 GiB repeatedly) - resulting KLD (0.161) was
# ~2x a clean reference run (~0.07). mode=fast + an explicit conservative
# vram_gb budget are the two documented, public levers for this (see
# docs/advanced-gguf-quantizer-flags.md "Runtime and memory" - batch/n_seq
# internals are explicitly NOT public tuning knobs).
name = "bible-assistant-nvfp4-gguf-v2"
model = "Ttimms/Bible-Assistant-Qwen3.5-4B-v3.2"
output = "/home/ttimm/models"
backend = "gguf"

[calibration]
dataset = "/home/ttimm/bible-ai-assistant/data/raw_v2/WEB.txt"

[gguf]
profile = "nvfp4"
target_bpw = 4.8
mode = "fast"
vram_gb = 12.0
tool_dir = "/home/ttimm/advanced-gguf-quantizer"
bf16_gguf = "/home/ttimm/models/bible-assistant-v3.2-bf16.gguf"
